// Open ?dev, then previewStyles(); previewStyles({ types: ['lodge'], tier: 2 }) for one pair.
function previewStyles({ types = Object.keys(MODELS_MODERN), tier = null, x = -28, z = 10, spacing = 7, focus = true } = {}) {
  if (!DEV) throw new Error('Building previews require ?dev');
  if (!Array.isArray(types) || !types.length || types.some((t) => !MODELS_MODERN[t])) throw new Error('Unknown preview building type');
  if (![x, z, spacing].every(Number.isFinite) || spacing < 6) throw new Error('Preview spacing must be at least 6');
  if (tier !== null && (!Number.isInteger(tier) || tier < 0 || types.some((t) => tier >= (BTYPES[t].tiers?.length || 1)))) throw new Error('Unknown preview tier');
  clearStylePreview();
  const root = new THREE.Group(), entries = [];
  root.name = '__buildingStylesPreview';
  let row = 0;
  for (const type of types) for (const t of (tier === null ? Array.from({ length: BTYPES[type].tiers?.length || 1 }, (_, i) => i) : [tier])) {
    const spec = BTYPES[type].tiers?.[t] || BTYPES[type], pz = z + row * spacing;
    // Sample a common floor for the pair so slopes cannot bury one of the two models.
    let floor = -Infinity;
    for (let px = x - 4.5 - spec.w / 2; px <= x + 4.5 + spec.w / 2 + 0.1; px += 0.5)
      for (const dz of [-spec.d / 2, 0, spec.d / 2]) floor = Math.max(floor, heightAt(px, pz + dz) * VEX + 0.08);
    for (const [style, fn, dx] of [['classic', MODELS[type], -4.5], ['modern', MODELS_MODERN[type], 4.5]]) {
      const k = fn(t), group = k.build();
      group.position.set(x + dx, floor, pz);
      group.name = `${type}-${t}-${style}`;
      root.add(group); entries.push({ type, tier: t, style, x: x + dx, y: floor, z: pz, seats: k.seats.length });
    }
    row++;
  }
  root.userData.entries = entries;
  scene.add(root);
  if (focus) {
    cam.target.set(x, entries.reduce((sum, e) => sum + e.y, 0) / entries.length, z + (row - 1) * spacing / 2);
    cam.az = cam.azGoal = 0.25;
    cam.viewH = Math.max(10, row * spacing * 0.7 + 6, 18 / (W / H)); cam.viewGoal = null;
    updateCamera();
  }
  renderer.shadowMap.needsUpdate = true;
  return entries;
}

function scandiHall(k, o) {
  const { x = 0, z = 0, w, d, h, color = 0xa74438 } = o;
  // A row of narrow, front-facing houses instead of a single broad chalet roof.
  const count = w >= 3 ? 3 : w >= 2.3 ? 2 : 1, bay = w / count;
  for (let i = 0; i < count; i++) {
    const px = x - w / 2 + bay * (i + 0.5), recess = i % 2 ? 0.12 : 0;
    const depth = d - recess, pz = z - recess / 2;
    const wall = Math.max(0.92, h) + (i % 2 ? 0.17 : 0), rise = bay * 0.58;
    const front = pz + depth / 2, width = bay - 0.075;
    const start = k.parts.length;
    hall(k, { x: px, z: pz, w: width, d: depth, h: wall, rise, over: 0.03, gableFront: true, windows: false, roof: accentMat(0x394449) });
    for (let j = start; j < k.parts.length; j++) {
      if (k.parts[j][1] === BM.log) k.parts[j][1] = accentMat(color);
      else if (k.parts[j][1] === BM.dark) k.parts[j][1] = SCANDI_TRIM;
    }
    // Tall paired windows with pale surrounds; upper gable light reads from a distance.
    for (const side of [-1, 1]) {
      const wx = px + side * width * 0.27;
      k.add(bx(width * 0.3, wall * 0.68, 0.035), SCANDI_TRIM, wx, wall * 0.51, front + 0.012);
      k.add(bx(width * 0.3 - 0.045, wall * 0.68 - 0.045, 0.025), BM.glow, wx, wall * 0.51, front + 0.035);
      k.add(bx(0.02, wall * 0.66, 0.02), SCANDI_TRIM, wx, wall * 0.51, front + 0.055);
      k.add(bx(0.04, wall, 0.035), SCANDI_TRIM, px + side * (width / 2 - 0.025), wall / 2, front + 0.01);
    }
    k.add(bx(width * 0.25, rise * 0.3, 0.025), BM.glow, px, wall + rise * 0.3, front + 0.02);
    for (let a = -width / 2 + 0.08; a < width / 2; a += 0.13)

  }
}
