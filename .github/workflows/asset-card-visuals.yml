name: Asset card visual checks
on:
  push:
    branches: [asset-controls]
    paths: ['index.html', 'tests/asset-card-visuals.mjs', '.github/workflows/asset-card-visuals.yml']
  workflow_dispatch:
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser
        working-directory: tests
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Check phone and desktop cards by day and after dark
        working-directory: tests
        run: node asset-card-visuals.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asset-card-screenshots
          path: tests/asset-card-screenshots/*.png
          retention-days: 7
