name: Placement visual checks
on:
  push:
    branches: [precise-placement]
    paths: ['index.html', 'tests/placement-visuals.mjs', '.github/workflows/placement-visuals.yml']
  workflow_dispatch:
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser
        working-directory: tests
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Check footprints and render phone and desktop placement
        working-directory: tests
        run: |
          node building-rotation.mjs
          node placement-visuals.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: placement-screenshots
          path: tests/placement-screenshots/*.png
          retention-days: 7
