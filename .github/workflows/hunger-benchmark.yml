name: Hunger balance and performance
on:
  push:
    branches: [hunger-reliability]
    paths: ['index.html', 'tests/hunger-benchmark.mjs', 'tests/harness.mjs', '.github/workflows/hunger-benchmark.yml']
  workflow_dispatch:
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser
        working-directory: tests
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Compare normal and high prices; time a large resort against main
        working-directory: tests
        run: node hunger-benchmark.mjs
