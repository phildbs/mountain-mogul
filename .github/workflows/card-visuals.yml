name: Map card visual checks
on:
  push:
    branches: [movable-cards]
    paths: ['index.html', 'tests/card-visuals.mjs', '.github/workflows/card-visuals.yml']
  workflow_dispatch:
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser
        working-directory: tests
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Render map cards on phone and desktop
        working-directory: tests
        run: node card-visuals.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map-card-screenshots
          path: tests/card-screenshots/*.png
          retention-days: 7
