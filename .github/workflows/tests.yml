# Runs the game's test scenarios on GitHub's servers whenever anyone pushes, so every branch and commit
# shows a green tick or a red cross. Nothing touches the real database: the tests use tests/fake-supabase.js.
# Pages that aren't the game (docs, roadmap, guide, stats) don't trigger it. Run it by hand (Actions › Tests › Run workflow) with "all" to include the slow season balance check.
name: Tests
on:
  push:
    paths-ignore: ['**.md', 'roadmap.html', 'guide.html', 'privacy.html', 'stats.html', 'supabase/**']
  workflow_dispatch:
    inputs:
      which:
        description: 'Scenarios to run: blank for the usual set, "all" for everything, or names like "glades themes"'
        required: false
        default: ''
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scenarios:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6] # six even groups side by side (evened out by tests/timings.json)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright and Chromium
        working-directory: tests
        run: |
          npm install --no-audit --no-fund
          npx playwright install chromium
          # Extra system packages (mostly fonts) come from Ubuntu's servers. When those can't be reached, apt waited
          # 10 minutes and failed every group (Nov 11); the runner already has what Chromium needs, so carry on.
          timeout 180 npx playwright install-deps chromium || echo "::warning::Couldn't fetch extra system packages; using the runner's own"
      - name: Run the scenarios
        working-directory: tests
        env:
          WHICH: ${{ github.event.inputs.which }}
          SHARD: ${{ matrix.shard }}/6
        run: node run.mjs $WHICH
