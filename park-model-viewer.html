<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Terrain Park Models · Mountain Mogul</title><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif}*{box-sizing:border-box}body{margin:0;background:#0d1822;color:#ecf4f8}.top{padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;background:#142637;border-bottom:1px solid #324557}.top h1{font-size:18px;margin:0}.sub{color:#a9bac8;font-size:12px}.layout{max-width:1200px;margin:auto;padding:16px;display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:14px}.stage{min-height:460px;height:calc(100dvh - 155px);max-height:820px;background:linear-gradient(#40647e,#c3dce7);border-radius:14px;position:relative;overflow:hidden;touch-action:none}canvas{width:100%;height:100%;display:block}.hint{position:absolute;bottom:15px;left:15px;background:#102536d9;padding:9px 12px;border-radius:8px;font-size:12px;pointer-events:none}.side{background:#172b3c;border:1px solid #324c60;border-radius:14px;padding:14px;height:max-content}.side h2{font-size:17px;margin:0 0 6px}.side p{color:#aec1cf;font-size:13px;line-height:1.5}.choices{display:grid;gap:8px}button{border:1px solid #446177;border-radius:8px;background:#20394d;color:#fff;font:inherit;padding:11px;text-align:left;cursor:pointer}button.active{background:#27647b;border-color:#60c2cf}button:hover{border-color:#91d6e0}.tag{display:inline-block;font-size:12px;color:#90d8e1;padding:5px 0}a{color:#85d9ec}@media(max-width:750px){.layout{display:flex;flex-direction:column;padding:8px}.stage{height:56dvh;min-height:330px}.choices{grid-template-columns:repeat(2,1fr)}.top{padding:12px}.side{padding:12px}.hint{font-size:11px}}
</style></head><body><header class="top"><div><h1>Mountain Mogul · Terrain Park Workshop</h1><div class="sub">Updated 3D models · visual review only</div></div><span class="tag">Unpublished preview</span></header><main class="layout"><div class="stage" id="stage"><div class="hint">Drag to rotate · Scroll or pinch to zoom</div></div><aside class="side"><h2 id="name">Small jump</h2><p id="info">Smooth snow takeoff and defined lip.</p><div class="choices" id="choices"></div><p>These are the actual meshes used by the proposed game update. No placement or gameplay changes.</p></aside></main><script src="vendor/three.min.js"></script><script src="park-models.js"></script><script>
const list=[['roller','Snow roller','Rounded, groomed snow mound.'],['box','Flat box','Metal riding surface and sturdy supports.'],['jump','Small jump','Sculpted snow kicker with a clean lip.'],['rail','Straight rail','Continuous tubular steel rail.'],['rainbow','Rainbow rail','Smooth curved rail with grounded supports.'],['tabletop','Large tabletop','A broad takeoff, flat deck and landing ramp.']];
const stage=document.getElementById('stage'),scene=new THREE.Scene();scene.background=new THREE.Color(0x66869f);
const camera=new THREE.PerspectiveCamera(42,1,.1,150);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;stage.insertBefore(renderer.domElement,stage.firstChild);
scene.add(new THREE.HemisphereLight(0xe6f8ff,0x667889,1.2));const sun=new THREE.DirectionalLight(0xffffff,1.3);sun.position.set(-7,13,9);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-12;sun.shadow.camera.right=12;sun.shadow.camera.top=12;sun.shadow.camera.bottom=-12;scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(100,100),new THREE.MeshLambertMaterial({color:0xdcebf4}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;ground.position.y=-.07;scene.add(ground);
const grid=new THREE.GridHelper(18,18,0x8eb2c3,0xb2cdda);grid.position.y=-.055;scene.add(grid);
let selected=null,yaw=.45,pitch=.44,dist=9,pointers=new Map(),last=null;
const buttons=document.getElementById('choices');
for(const [id,name,desc] of list){const btn=document.createElement('button');btn.textContent=name;btn.dataset.id=id;btn.onclick=()=>choose(id);buttons.append(btn);}
function choose(id){if(selected)scene.remove(selected);selected=createParkFeatureModel(id);scene.add(selected);const item=list.find(v=>v[0]===id);document.getElementById('name').textContent=item[1];document.getElementById('info').textContent=item[2];for(const b of buttons.children)b.classList.toggle('active',b.dataset.id===id);dist=id==='tabletop'?11:8;draw();}
function draw(){const w=stage.clientWidth,h=stage.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();const target=new THREE.Vector3(0,.55,0);camera.position.set(target.x+dist*Math.sin(yaw)*Math.cos(pitch),target.y+dist*Math.sin(pitch),target.z+dist*Math.cos(yaw)*Math.cos(pitch));camera.lookAt(target);renderer.render(scene,camera);}
function clamp(x,a,b){return Math.max(a,Math.min(b,x))}
renderer.domElement.addEventListener('pointerdown',e=>{renderer.domElement.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});last=null;});
renderer.domElement.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const p=pointers.get(e.pointerId);if(pointers.size===1){yaw-=(e.clientX-p.x)*.009;pitch=clamp(pitch+(e.clientY-p.y)*.007,.12,1.42);}else{const arr=[...pointers.values()];const other=arr.find(x=>x!==p);if(other){const d=Math.hypot(e.clientX-other.x,e.clientY-other.y);if(last)dist=clamp(dist*last/d,3,22);last=d;}}p.x=e.clientX;p.y=e.clientY;draw();});
for(const event of ['pointerup','pointercancel'])renderer.domElement.addEventListener(event,e=>{pointers.delete(e.pointerId);last=null;});
renderer.domElement.addEventListener('wheel',e=>{e.preventDefault();dist=clamp(dist*Math.exp(e.deltaY*.001),3,24);draw();},{passive:false});
window.addEventListener('resize',draw);choose('jump');
</script></body></html>
