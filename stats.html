<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Mogul Stats</title>
<link rel="icon" type="image/png" sizes="192x192" href="vendor/icon-192-v2.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root {
  --ink: #14243a; --ink-2: #51627a; --muted: #7a8aa0; --line: rgba(20, 36, 58, 0.12); --line-soft: rgba(20, 36, 58, 0.08);
  --card: rgba(255, 255, 255, 0.86); --accent: #df562c; --bar: #2b5d9e; --bar-soft: #c9d8ec; --good: #2c9a55; --bad: #b3261e; --idea: #d99a14;
  --display: 'Big Shoulders Display', 'Arial Narrow', sans-serif; --ui: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: linear-gradient(180deg, #bfd3ea 0%, #e8eef6 40%, #eef2f7 100%) fixed; color: var(--ink); font-family: var(--ui); -webkit-font-smoothing: antialiased; }
main { max-width: 980px; margin: 0 auto; padding: 24px 16px 48px; }
header { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
header svg { width: 44px; height: 44px; border-radius: 10px; flex: none; }
h1 { font-family: var(--display); font-weight: 800; font-size: 34px; letter-spacing: 0.02em; text-transform: uppercase; margin: 0; line-height: 1; }
h2 { font-size: 15px; margin: 0 0 4px; }
h3 { font-size: 13.5px; margin: 14px 0 4px; }
.sub { color: var(--ink-2); font-size: 13px; margin-top: 3px; }
header .back { margin-left: auto; color: var(--ink); font: 600 14px var(--ui); text-decoration: none; padding: 9px 6px; white-space: nowrap; }
header button { border: 1px solid var(--line); background: var(--card); color: var(--ink); font: 600 14px var(--ui); padding: 9px 14px; border-radius: 10px; cursor: pointer; }
.note { color: var(--ink-2); font-size: 12.5px; margin: 0 0 12px; }
.err { color: var(--bad); }
a { color: var(--accent); }

/* Tabs: one area at a time, so the page reads on a phone */
.tabs { position: sticky; top: 0; z-index: 5; display: flex; gap: 2px; padding: 4px; margin: 0 -4px 14px; background: rgba(232, 238, 246, 0.92); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-radius: 12px; overflow-x: auto; scrollbar-width: none; }
.tabs button { flex: 1 0 auto; border: 0; background: none; border-radius: 9px; padding: 9px 12px; font: 600 14px var(--ui); color: var(--ink-2); cursor: pointer; white-space: nowrap; }
.tabs button[aria-selected="true"] { background: #fff; color: var(--ink); box-shadow: 0 1px 4px rgba(20, 36, 58, 0.16); }
.tabs .badge { display: inline-block; min-width: 18px; margin-left: 5px; padding: 1px 6px; border-radius: 999px; background: var(--accent); color: #fff; font-size: 11px; font-weight: 700; }
.tabs .badge.warn { background: var(--bad); }
.tabs .badge[hidden] { display: none; }
@media (max-width: 480px) {
  h1 { font-size: 28px; }
  header { gap: 10px; }
  header svg { width: 38px; height: 38px; }
  header .back { padding: 9px 2px; }
  .tabs button { padding: 9px 8px; font-size: 13.5px; }
}
.panel { display: grid; gap: 12px; }
.panel[hidden] { display: none; }

.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); margin: 0; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; box-shadow: 0 6px 18px rgba(20, 36, 58, 0.07); min-width: 0; }
.tile dt { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); }
.tile dd { margin: 4px 0 0; font-family: var(--display); font-weight: 800; font-size: 40px; line-height: 1; font-variant-numeric: tabular-nums; }
.tile small { display: block; margin-top: 4px; color: var(--muted); font-size: 12.5px; }
.meter { height: 8px; background: var(--line); border-radius: 4px; margin-top: 10px; overflow: hidden; }
.meter i { display: block; height: 100%; background: #326b91; border-radius: 4px; }
.two { display: grid; gap: 12px; grid-template-columns: 1fr; }
@media (min-width: 760px) { .two { grid-template-columns: 1fr 1fr; } }

/* Column charts */
.cols { display: flex; align-items: flex-end; gap: 2px; height: 150px; border-bottom: 1px solid var(--line); }
.col { flex: 1 1 0; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; min-width: 0; }
.col i { display: block; width: 100%; max-width: 26px; background: var(--accent); border-radius: 4px 4px 0 0; min-height: 2px; }
.col b { font-size: 11px; font-weight: 600; color: var(--ink-2); margin-bottom: 3px; font-variant-numeric: tabular-nums; }
.col:hover i { filter: brightness(0.85); }
.days { display: flex; gap: 2px; margin-top: 5px; }
.days span { flex: 1 1 0; text-align: center; font-size: 10.5px; color: var(--muted); min-width: 0; white-space: nowrap; }
.days span:first-child { text-align: left; }
.key { display: inline-flex; align-items: center; gap: 5px; margin-right: 12px; }
.key i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

/* Bar lists */
.bars { display: grid; gap: 9px; }
.bar { display: grid; grid-template-columns: minmax(110px, 38%) 1fr; gap: 10px; align-items: center; font-size: 13.5px; }
.bar .track { position: relative; height: 22px; overflow: hidden; }
.bar .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--bar); border-radius: 0 4px 4px 0; min-width: 2px; }
.bar .val { position: absolute; top: 2px; font-size: 12.5px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
.bar .val.in { color: #fff; }
.bar .lbl small { color: var(--muted); }

/* Tables */
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th { text-align: left; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); font-weight: 700; padding: 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 7px 6px; border-bottom: 1px solid var(--line-soft); vertical-align: top; font-variant-numeric: tabular-nums; }
.num { text-align: right; }
.scroll { overflow-x: auto; }
.head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
.head h2 { margin: 0; }
.range { display: inline-flex; flex-wrap: wrap; gap: 2px; background: rgba(20, 36, 58, 0.06); padding: 3px; border-radius: 10px; }
.range button { border: 0; background: none; border-radius: 8px; padding: 6px 10px; font: 600 12.5px var(--ui); color: var(--ink-2); cursor: pointer; }
.range button b { font-weight: 700; margin-left: 3px; }
.range button[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(20, 36, 58, 0.15); }
.pickb { border: 0; background: none; font-size: 18px; line-height: 1; cursor: pointer; color: #b9c2cf; padding: 2px 4px; }
.pickb.on { color: var(--idea); }
.linkb { border: 0; background: none; padding: 0; font: inherit; color: var(--accent); text-decoration: underline; cursor: pointer; }
.more { margin: 10px 0 0; font-size: 13.5px; }
.sortb { border: 0; background: none; padding: 0; font: inherit; color: inherit; letter-spacing: inherit; text-transform: inherit; cursor: pointer; display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; }
.sortb span { font-size: 9px; color: var(--accent); }
.sortb.on { color: var(--ink); }
th.num .sortb { justify-content: flex-end; width: 100%; }
.visit { color: var(--ink); font-weight: 600; text-decoration: underline; text-decoration-color: rgba(20, 36, 58, 0.3); text-underline-offset: 3px; }
.priv { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 1px 6px; white-space: nowrap; }
.fold > summary { display: flex; align-items: baseline; gap: 10px; cursor: pointer; list-style: none; }
.fold > summary::-webkit-details-marker { display: none; }
.fold > summary::after { content: '▸'; margin-left: auto; color: var(--ink-2); transition: transform .15s; }
.fold[open] > summary::after { transform: rotate(90deg); }
.fold[open] > summary { margin-bottom: 8px; }
details > summary { cursor: pointer; }
.small { font-size: 12.5px; color: var(--ink-2); margin-top: 8px; }
.kmh { margin: 14px 0 4px; font-size: 15px; } .kmh .note { font-weight: 500; font-size: 12.5px; }

/* Feedback */
.fbbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.fbwho { display: flex; align-items: center; gap: 8px; font-size: 13.5px; }
.fb { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
.fb li { position: relative; background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 12px; padding: 11px 14px; box-shadow: 0 4px 12px rgba(20, 36, 58, 0.05); }
.fb li.idea { border-left-color: var(--idea); }
.fb .top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.fb .kind { font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; font-size: 10.5px; color: var(--accent); }
.fb li.idea .kind { color: #a8740a; }
.fb .new { font-weight: 700; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em; color: #fff; background: var(--accent); border-radius: 999px; padding: 1px 7px; }
.fb .msg { font-size: 14.5px; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; }
.fb .who { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin-top: 9px; padding-top: 8px; border-top: 1px solid var(--line-soft); font-size: 13px; }
.fb .who b { font-weight: 700; }
.fb .ctx { flex-basis: 100%; color: var(--muted); font-size: 12px; }
.fb .go { margin-left: auto; display: inline-flex; align-items: center; gap: 4px; padding: 6px 11px; border-radius: 9px; background: var(--ink); color: #fff; font-weight: 600; font-size: 13px; text-decoration: none; white-space: nowrap; }
.fb .go:hover { background: #24395a; }
.fb .nogo { margin-left: auto; color: var(--muted); font-size: 12.5px; }

/* Errors */
.errs details { border-top: 1px solid var(--line); padding: 8px 0; }
.errs summary { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; list-style: none; font-size: 13.5px; }
.errs summary::-webkit-details-marker { display: none; }
.errs .ver { font-weight: 700; color: var(--bad); font-variant-numeric: tabular-nums; }
.errs .msg { overflow-wrap: anywhere; }
.errs .cnt { grid-column: 2; color: var(--muted); font-size: 12px; }
.errs pre { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 11.5px; background: rgba(20, 36, 58, 0.05); border-radius: 8px; padding: 8px; margin: 8px 0 4px; max-height: 220px; overflow: auto; }

/* Update reactions */
.rx td { padding: 7px 8px 7px 0; white-space: nowrap; }
.rx .ver { font-weight: 700; white-space: normal; }
.rxwhat { display: block; font-weight: 400; margin-top: 2px; max-width: 46ch; }
.rxwhat b { display: block; font-weight: 600; font-size: 13px; }
.rxwhat small { display: block; font-size: 12px; color: var(--ink-2); line-height: 1.35; }
.rxbar { display: inline-block; width: 70px; height: 8px; border-radius: 4px; background: rgba(210, 60, 90, 0.25); vertical-align: middle; overflow: hidden; }
.rxbar i { display: block; height: 100%; background: var(--good); }
@media (max-width: 640px) {
  .rx tr { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; padding: 8px 0; border-top: 1px solid var(--line-soft); }
  .rx td { border: 0; padding: 0; }
  .rx .ver { flex-basis: 100%; }
  .rxwhat { max-width: none; }
}

/* New resorts, step by step */
.cohorts td { white-space: nowrap; }
.cohorts .cpct { display: inline-block; min-width: 44px; padding: 2px 6px; border-radius: 6px; font-weight: 700; background: linear-gradient(90deg, rgba(44,154,85,.22) var(--p), rgba(20,36,58,.05) var(--p)); }
.cohorts small { display: block; font-size: 11px; color: var(--ink-2); }

/* Signed-in players */
.players td { padding: 8px; }
.players .pres { margin-bottom: 6px; }
.players .pres .note { display: block; font-size: 12px; margin: 0; }
@media (max-width: 600px) {
  .players thead { display: none; }
  .players tr { display: block; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .players td { display: inline-block; border: 0; padding: 2px 8px 2px 0; }
  .players td:nth-child(2)::before { content: 'Signed up '; color: var(--ink-2); }
  .players td:nth-child(3)::before { content: '· seen '; color: var(--ink-2); }
  .players td:first-child, .players td:last-child { display: block; }
  .players td:last-child { padding-top: 6px; }
}
.gate { text-align: center; padding: 40px 20px; }
.gate a { font-weight: 600; }
.kform { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px 14px; margin-top: 8px; }
.kform label { display: grid; gap: 4px; font-size: 12px; font-weight: 700; color: var(--ink-2); text-transform: uppercase; letter-spacing: 0.06em; }
.kform input:not([type=checkbox]), .kform select { padding: 9px 10px; border: 1px solid var(--line); border-radius: 9px; font: 500 14px var(--ui); color: var(--ink); background: #fff; text-transform: none; letter-spacing: 0; min-width: 0; }
.kform .kcheck { display: block; text-transform: none; letter-spacing: 0; font-size: 14px; color: var(--ink); font-weight: 600; }
.kform .kcheck small { display: block; font-weight: 400; color: var(--ink-2); font-size: 12.5px; margin-left: 22px; }
.kform button, .klobby button { border: 1px solid var(--line); background: #fff; color: var(--ink); font: 600 13.5px var(--ui); padding: 8px 12px; border-radius: 10px; cursor: pointer; }
.kform button[type=submit] { background: var(--accent); border-color: var(--accent); color: #fff; }
.klist { display: grid; gap: 8px; margin-top: 8px; }
.klobby { display: grid; gap: 6px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: #fff; min-width: 0; overflow-wrap: anywhere; }
.klobby.khidden { opacity: 0.6; }
.khead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; }
.kstat { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; padding: 2px 8px; border-radius: 999px; background: var(--line-soft); }
.kstat.open { background: rgba(44, 154, 85, 0.14); color: #1f7a42; } .kstat.running { background: rgba(217, 154, 20, 0.16); color: #8a5d00; }
.kkind { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--line-soft); color: var(--ink-2); } .kkind.official { background: rgba(217, 154, 20, 0.18); color: #7a5410; }
.kchips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.kchip[aria-pressed="true"] { background: var(--ink) !important; color: #fff !important; border-color: var(--ink) !important; }
.klobby .kclose { color: var(--bad); }
</style>
</head>
<body>
<main>
  <header>
    <svg viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" fill="#14243a"/><path fill="#e8f0f8" d="M215 122 L39.5 409 L418.5 409 Z M368 204 L198.5 409 L482.3 409 Z"/><path fill="#fff" d="M215 122 L167.3 200 L196 184 L226 209 L258.2 183 Z"/><rect y="409" width="512" height="103" fill="#c9472a"/><path stroke="#c9472a" stroke-width="9" d="M147.2 420 L264 274"/></svg>
    <div><h1>Mogul Stats</h1><div class="sub" id="when">Loading…</div></div>
    <a class="back" href="./">‹ Game</a>
    <button id="refresh" hidden>Refresh</button>
  </header>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Sections" hidden>
    <button role="tab" data-tab="overview">Overview</button>
    <button role="tab" data-tab="feedback">Feedback<span class="badge" id="fbBadge" hidden></span></button>
    <button role="tab" data-tab="resorts">Resorts</button>
    <button role="tab" data-tab="health">Health<span class="badge warn" id="errBadge" hidden></span></button>
    <button role="tab" data-tab="kotm">King of the Mountain<span class="badge warn" id="kBadge" hidden></span></button>
  </nav>
  <div id="out"></div>
  <p class="note" style="text-align:center;margin:18px 0 8px">Mountain Mogul · a <a href="https://mossquake.com">MossQuake</a> game</p>
</main>
<script src="vendor/supabase.js"></script>
<script>
(() => {
  const SB_URL = 'https://iwhhoneaxmeiktqzwxjs.supabase.co';
  const SB_KEY = 'sb_publishable_i3vLnQD9KEe1vjfXUORZdQ__M2xC90G';
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const num = (n) => Number(n || 0).toLocaleString('en-US');
  const pct = (a, b) => (b ? Math.round((a / b) * 100) + '%' : '–');
  const MT = { juniper: 'Juniper Ridge', maple: 'Maple Notch', raven: 'Raven Peak', twin: 'Twin Notch', lonepine: 'Lone Pine Hill', ridgeback: 'Ridgeback', '': 'Not recorded' };
  const mtName = (m) => MT[m] ?? (String(m).startsWith('c:') ? 'Custom mountain' : m);
  const ago = (t) => { const s = (Date.now() - new Date(t)) / 1000; return s < 3600 ? `${Math.max(1, Math.round(s / 60))} min ago` : s < 86400 ? `${Math.round(s / 3600)} h ago` : `${Math.round(s / 86400)} d ago`; };
  const sb = window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: true, autoRefreshToken: true } });

  const gate = (msg) => { $('when').textContent = ''; $('out').innerHTML = `<div class="card gate">${msg}</div>`; };

  async function load() {
    $('when').textContent = 'Loading…';
    const { data: { session } } = await sb.auth.getSession();
    if (!session || session.user.is_anonymous) return gate('Sign in on <a href="./">mtmogul.com</a> with your Google account (title screen › Community), then come back here.');
    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC';
    const { data, error } = await sb.rpc('admin_stats', { tz });
    if (error) {
      if (/not allowed|permission/i.test(error.message)) return gate(`Signed in as ${esc(session.user.email)}. These stats are only for the game’s owner.`);
      if (/admin_stats/.test(error.message)) return gate('<span class="err">The stats function isn’t set up yet.</span> Run <b>supabase/stats.sql</b> in the Supabase SQL Editor.');
      return gate(`<span class="err">${esc(error.message)}</span>`);
    }
    const [er, rx, pl, fb] = await Promise.all([sb.rpc('admin_errors'), sb.rpc('admin_reactions'), sb.rpc('admin_players'), sb.rpc('admin_feedback', { lim: 300 }), loadChanges()]);
    const got = (r, fn) => (r.error ? { missing: new RegExp(fn).test(r.error.message), message: r.error.message } : r.data);
    render(data, got(er, 'admin_errors'), got(rx, 'admin_reactions'), got(pl, 'admin_players'), got(fb, 'admin_feedback'));
    loadCohorts();
    loadRetention();
    loadSources();
    loadBoardOpens();
    sb.rpc('admin_chat_reports').then(({ data }) => { const n = (data || []).filter((r) => !r.hidden).length; $('kBadge').hidden = !n; $('kBadge').textContent = n; }, () => {});
  }

  async function loadRetention() {
    const el = $('retention');
    if (!el) return;
    const { data, error } = await sb.rpc('admin_retention');
    if (error) {
      el.innerHTML = `<h2>Player retention</h2><p class="note">${/PGRST202|42883/.test(error.code || '') ? 'Daily activity tracking is not set up yet. Run supabase/retention.sql in the SQL Editor. Past daily activity cannot be reconstructed from the latest save.' : esc(error.message)}</p>`;
      return;
    }
    el.innerHTML = retentionHtml(data);
  }
  function retentionHtml(d) {
    const daily = d.daily || [], max = Math.max(1, ...daily.map(r => Number(r.active)));
    const rates = (d.rates || []).map(r => {
      const n = Number(r.eligible), v = Number(r.returned), p = n ? Math.round(v / n * 100) : null;
      return `<div class="card tile"><dt>Came back on day ${r.day}</dt><dd>${p === null ? '—' : p + '%'}</dd><small>${n ? `${num(v)} of ${num(n)} players` : 'Waiting for players'}</small><div class="meter"><i style="width:${p || 0}%"></i></div></div>`;
    }).join('');
    return `<h2>Player retention</h2><p class="note">Players who saved their resort again exactly 1, 7 or 30 days after they started. Tracking since ${esc(d.since)}.</p>
      <dl class="grid">${rates}</dl>
      <h3>Daily active players</h3><p class="note"><span class="key"><i style="background:#326b91"></i>New</span><span class="key"><i style="background:#37846b"></i>Returning</span>UTC days; today isn’t over yet.</p>
      ${daily.length ? `<div class="cols" role="img" aria-label="Daily active players, new and returning. Exact counts follow in the table.">${daily.map(r => `<div class="col" title="${esc(r.day)}: ${num(r.new)} new, ${num(r.returning)} returning"><b>${num(r.active)}</b><i style="height:${Number(r.active)/max*82}%;background:linear-gradient(to top,#326b91 ${r.active ? Number(r.new)/Number(r.active)*100 : 0}%,#37846b 0)"></i></div>`).join('')}</div>` : '<p class="note">The first full tracking day has not started yet.</p>'}
      <details class="small"><summary>Daily counts and how they’re measured</summary><div class="scroll"><table><thead><tr><th>UTC date</th><th class="num">New</th><th class="num">Returning</th><th class="num">Total</th></tr></thead><tbody>${daily.map(r => `<tr><td>${esc(r.day)}</td><td class="num">${num(r.new)}</td><td class="num">${num(r.returning)}</td><td class="num">${num(r.active)}</td></tr>`).join('')}</tbody></table></div>

    const reps = kot.reports;
    const chat = `<section class="card"><h2>Chat reports</h2>${reps == null ? `<p class="note">${/admin_chat_reports/.test(kot.reportErr) ? 'Not set up yet. Run <b>supabase/match-chat.sql</b> in the Supabase SQL Editor.' : `<span class="err">${esc(kot.reportErr)}</span>`}</p>`
      : reps.length ? `<p class="note">Messages players reported, newest first. Hiding one removes it for everyone; a chat ban stops that account posting for 7 days (they can still play).</p><div class="klist">${reps.map((r) => `<div class="klobby${r.hidden ? ' khidden' : ''}">
          <div class="khead"><b>${esc(r.name)}</b><span class="note">${esc(r.lobby)} · reported ${r.reports} ${r.reports === 1 ? 'time' : 'times'}${r.hidden ? ' · hidden' : ''}</span></div>
          <div>${esc(r.body)}</div>${r.reasons && r.reasons.length ? `<div class="note">${r.reasons.map(esc).join(' · ')}</div>` : ''}

      : '<p class="note">No reports. ✓</p>'}</section>`;

  }
  // How multiplayer is doing: who tries it, who keeps playing, and each match's players. From admin_match_stats
  // (supabase/match-stats.sql). Active = sent a change or wrote in the chat; watching isn't recorded.
  function kotmStats() {
    const s = kot.stats, head = '<h2>How multiplayer is doing</h2>';
    if (!s) return `<section class="card">${head}<p class="note">${/admin_match_stats/.test(kot.statsErr) ? 'Not set up yet. Run <b>supabase/match-stats.sql</b> in the Supabase SQL Editor.' : `<span class="err">${esc(kot.statsErr)}</span>`}</p></section>`;
    const money = (n) => (n == null ? '–' : `${n < 0 ? '−' : ''}$${Math.abs(Math.round(n)).toLocaleString('en-US')}`);
    const lob = s.lobbies || {}, seats = s.seats || {};
    const tiles = `<dl class="grid">
      <div class="card tile"><dt>Tried it</dt><dd>${num(s.players)}</dd><small>joined a match · ${pct(s.players, s.signed_in)} of ${num(s.signed_in)} signed-in players</small></div>
      <div class="card tile"><dt>Active today</dt><dd>${num(s.active_24h)}</dd><small>sent a change or chatted · 24 h · ${num(s.active_7d)} this week</small></div>
      <div class="card tile"><dt>New this week</dt><dd>${num(s.new_7d)}</dd><small>joined their first match</small></div>
      <div class="card tile"><dt>Came back</dt><dd>${pct(s.two_days, s.players)}</dd><small>${num(s.two_days)} played on 2+ different days</small></div>
      <div class="card tile"><dt>Seats filled</dt><dd>${pct(seats.filled, seats.total)}</dd><small>${num(seats.filled)} of ${num(seats.total)} seats in started matches</small></div>
      <div class="card tile"><dt>Matches</dt><dd>${num(lob.running)}</dd><small>running · ${num(lob.open)} open · ${num(lob.finished)} finished</small></div>
    </dl>`;
    const days = (s.per_day || []).map((d, i) => { const t = new Date(d.day + 'T12:00'); return { ...d, label: t.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }), short: String(t.getDate()), first: i === 0 || t.getDate() === 1 }; });
    const max = Math.max(1, ...days.map((d) => d.active));
    const chart = `<section class="card"><h2>Active players per day</h2><p class="note">Players who sent a change or chatted in a match, the last 14 days, in your time zone.</p>
      <div class="cols" role="img" aria-label="Active multiplayer players per day">${days.map((d) => `<div class="col" title="${d.label}: ${d.active} active · ${d.joined} joined a match${d.new ? ` (${d.new} for the first time)` : ''}"><b>${d.active || ''}</b><i style="height:${(d.active / max) * 82}%"></i></div>`).join('')}</div>
      <div class="days">${days.map((d) => `<span>${d.first ? d.label : d.short}</span>`).join('')}</div></section>`;
    const steps = [['Signed in', s.signed_in], ['Joined a match', s.players], ['Sent a change', s.sent_order], ['Played on 2+ days', s.two_days], ['Played on 5+ days', s.five_days], ['Played 2+ matches', s.two_matches]];
    const top = Math.max(1, s.signed_in || 0);
    const funnel = `<section class="card"><h2>How far players get</h2><p class="note">Share of signed-in players, since multiplayer began.</p><div class="bars">${steps.map(([l, n]) => { const w = (n / top) * 100;
      return `<div class="bar"><span class="lbl">${esc(l)}</span><span class="track"><span class="fill" style="width:${w}%"></span>${w > 60 ? `<span class="val in" style="right:calc(${100 - w}% + 8px)">` : `<span class="val" style="left:calc(${w}% + 6px)">`}${num(n)} · ${pct(n, top)}</span></span></div>`; }).join('')}</div>
      <p class="small">Made by players: ${num(lob.custom)} ${lob.custom === 1 ? 'match' : 'matches'} from ${num(lob.makers)} ${lob.makers === 1 ? 'player' : 'players'} · official: ${num(lob.official)} · Crown Peak ${num(lob.crown)}, Ridgeline ${num(lob.ridge)}.
      Resorts left: ${num(s.left)}, rescued: ${num(s.rescued)}. Chat this week: ${num(s.chat_7d)} ${s.chat_7d === 1 ? 'message' : 'messages'} from ${num(s.chatters_7d)} ${s.chatters_7d === 1 ? 'player' : 'players'}.</p></section>`;
    const ms = (s.matches || []).filter((m) => m.status !== 'open' || m.players.length);
    const table = ms.length ? `<section class="card"><h2>Matches, player by player</h2><p class="note">Running matches first, then ones from the last 14 days. Changes: what each player sent the server (all · last 24 h). Profit is the season so far.</p>
      ${ms.map((m) => `<h3 class="kmh">${esc(m.name)} <span class="note">${m.status === 'running' ? `day ${m.day} of ${m.days}` : m.status}${m.days === 363 ? ' · 2 seasons' : m.days === 558 ? ' · 3 seasons' : ''} · ${m.map === 'ridge' ? 'Ridgeline' : m.map === 'valley' ? 'Willow Valley' : 'Crown Peak'}${m.kind === 'custom' ? ' · player match' : ''}</span></h3>
      <div class="scroll"><table><thead><tr><th>Resort</th><th>Player</th><th class="num">Changes</th><th class="num">Chats</th><th>Last active</th><th class="num">Profit</th><th class="num">Guests</th><th class="num">Lifts · trails</th></tr></thead><tbody>
      ${m.players.map((p) => `<tr><td><b>${esc(p.resort)}</b>${p.left ? ' <span class="priv">left</span>' : ''}</td><td>${p.real ? esc(p.player || '–') : '<span class="note">empty</span>'}${p.joined_day ? `<small class="note"> · joined day ${p.joined_day}</small>` : ''}</td>
        <td class="num">${num(p.orders)} · ${num(p.orders_24h)}</td><td class="num">${num(p.chats)}</td><td>${p.last_seen ? ago(p.last_seen) : '–'}</td>
        <td class="num">${money(p.profit)}</td><td class="num">${p.guests == null ? '–' : num(p.guests)}</td><td class="num">${p.lifts == null ? '–' : `${p.lifts} · ${p.trails}`}</td></tr>`).join('')}</tbody></table></div>`).join('')}</section>` : '';
    return tiles + `<div class="two">${chart}${funnel}</div>` + table;
  }
  // Changing the day length updates how long each match length takes in real time.
  document.addEventListener('change', (e) => {
    if (e.target.name !== 'turn' || !e.target.closest('#kNew')) return;
    for (const o of e.target.form.elements.days.options) { const k = K_LENGTHS.find(([d]) => d === +o.value); if (k) o.textContent = kLengthLabel(k[0], k[1], +e.target.value); }
  });
  document.addEventListener('submit', async (e) => {
    if (e.target.id !== 'kNew') return;
    e.preventDefault();
    const f = new FormData(e.target), msg = (t) => { if ($('kMsg')) $('kMsg').innerHTML = t; };
    const name = String(f.get('name') || '').trim(), starts = new Date(String(f.get('starts')));
    if (name.length < 3) return msg('<span class="err">Give it a name of at least 3 letters.</span>');
    if (!(starts > new Date())) return msg('<span class="err">Pick a start time in the future.</span>');
    if (f.get('map') === 'match' && +f.get('slots') > 3) return msg('<span class="err">Crown Peak has three slices: pick 2 or 3 resorts, or Ridgeline or Willow Valley for 4.</span>');
    kotBusy = true; renderKotm();
    const { data: id, error } = await sb.rpc('admin_match_lobby', { pname: name, pstarts: starts.toISOString(), pslots: +f.get('slots'), pdays: +f.get('days'), pprize: String(f.get('prize') || '').trim() || null, pmap: String(f.get('map') || 'match') });
    let err = error;
    if (!err) {
      const late = String(f.get('late') || '').trim();
      const s = await sb.rpc('admin_match_settings', { lid: id, pcomputers: false, plate_days: late === '' ? null : +late });
      if (s.error && !/admin_match_settings/.test(s.error.message)) err = s.error;
      // Shorter turns need supabase/match-custom.sql; without it the lobby is still made, with 30-minute days.
      if (!err && f.get('latejoin') !== 'on') { const t = await sb.rpc('admin_match_late', { lid: id, plate: false }); if (t.error) err = { message: `Made it, but late joining is still on: ${/admin_match_late/.test(t.error.message) ? 'run supabase/match-options.sql in the Supabase SQL Editor first' : t.error.message}.` }; }
      if (!err && +f.get('turn') !== 30) { const t = await sb.rpc('admin_match_turn', { lid: id, pminutes: +f.get('turn') }); if (t.error) err = { message: `Made it, but with 30-minute days: ${/admin_match_turn/.test(t.error.message) ? 'run supabase/match-custom.sql in the Supabase SQL Editor first' : t.error.message}.` }; }
      // Two or three seasons need supabase/match-official-seasons.sql. Without it the match would play as one very
      // long season, so it's closed again rather than left to start.
      if (!err && K_SEASONS[+f.get('days')]) { const t = await sb.rpc('admin_match_seasons', { lid: id, pseasons: K_SEASONS[+f.get('days')] });
        if (t.error) { await sb.rpc('admin_match_close', { lid: id }); err = { message: `Not made: ${/admin_match_seasons/.test(t.error.message) ? 'run supabase/match-official-seasons.sql in the Supabase SQL Editor first, then try again' : t.error.message}.` }; } }
      // The title screen flag needs supabase/match-flag.sql; without it the lobby is still made, unflagged.
      if (!err && f.get('flag') === 'on') { const r = await sb.rpc('admin_match_flag', { lid: id, pflag: true }); if (r.error) err = { message: `Made it, but couldn’t flag it: ${/admin_match_flag/.test(r.error.message) ? 'run supabase/match-flag.sql in the Supabase SQL Editor first' : r.error.message}.` }; }

  document.addEventListener('click', async (e) => {
    const set = e.target.closest('[data-kset]'), close = e.target.closest('[data-kclose]'), hide = e.target.closest('[data-khide]'), ban = e.target.closest('[data-kban]'), flag = e.target.closest('[data-kflag]');
    if (!set && !close && !hide && !ban && !flag) return;
    let r;
    if (flag) { const l = kot.lobbies.find((x) => x.id === flag.dataset.kflag); r = await sb.rpc('admin_match_flag', { lid: l.id, pflag: !l.flag }); }
    if (set) { const l = kot.lobbies.find((x) => x.id === set.dataset.id), k = set.dataset.kset; r = k === 'late' ? await sb.rpc('admin_match_late', { lid: l.id, plate: l.late === false }) : await sb.rpc('admin_match_settings', { lid: l.id, [k === 'computers' ? 'pcomputers' : 'pkeep']: l[k] === false }); }
    if (close) { if (!confirm('Close this lobby? It leaves the game for everyone, and a running match stops.')) return; r = await sb.rpc('admin_match_close', { lid: close.dataset.kclose }); }
    if (hide) r = await sb.rpc('admin_chat_hide', { mid: +hide.dataset.khide, hide: hide.dataset.v === 'true' });

  });

  // Tabs: the page shows one area at a time and remembers the last one (or the one in the address, like #feedback).
  const TABS = ['overview', 'feedback', 'resorts', 'health', 'kotm'];
  let tab = TABS.includes(location.hash.slice(1)) ? location.hash.slice(1) : (() => { try { return localStorage.getItem('mm.stats.tab'); } catch (e) { return null; } })();
  if (!TABS.includes(tab)) tab = 'overview';
  function showTab(t) {
    tab = t;
    try { localStorage.setItem('mm.stats.tab', t); } catch (e) { /* fine without it */ }
    if (location.hash !== '#' + t) history.replaceState(null, '', '#' + t);
    document.querySelectorAll('#tabs [data-tab]').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === t)));
    document.querySelectorAll('.panel').forEach((p) => { p.hidden = p.dataset.panel !== t; });

    if (t === 'kotm') loadKotm();
  }

  // Feedback and feature ideas, each with who sent it and the resort they were most likely playing.
  // Ideas arrive as feedback starting "💡 Idea:". Without supabase/feedback.sql the page falls back to
  // admin_stats' short lists, which have no sender.
  const IDEA = '💡 Idea:', isIdea = (m) => m.startsWith(IDEA);
  let fb = { items: [], ideas: 0, notes: 0, who: true }, fbKind = 'all', fbPlayer = null, fbAll = false, fbSeenBefore = 0;
  const FB_ROWS = 40;
  try { fbSeenBefore = Number(localStorage.getItem('mm.stats.fbSeen')) || 0; } catch (e) { /* everything counts as seen */ }
  function feedbackFrom(d, x) {
    if (x && !x.missing && !x.message) return { items: x.items, ideas: Number(x.ideas), notes: Number(x.notes), who: true };
    const old = d.ideas ? [...d.ideas, ...d.feedback] : d.feedback;
    const items = old.map((f) => ({ ...f })).sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
    const ideas = d.ideas ? d.ideas_count : items.filter((f) => isIdea(f.message)).length;

  }
  const isNew = (f) => fbSeenBefore && +new Date(f.created_at) > fbSeenBefore;
  function markFeedbackSeen() {
    const newest = fb.items.length ? +new Date(fb.items[0].created_at) : 0;
    try { if (newest) localStorage.setItem('mm.stats.fbSeen', String(newest)); } catch (e) { /* fine */ }
    $('fbBadge').hidden = true;
  }
  const deviceOf = (c) => (c.touch ? (Math.min(...String(c.screen || '0x0').split('x').map(Number)) < 600 ? 'phone' : 'tablet') : 'computer');
  function contextLine(c) {
    if (!c || !Object.keys(c).length) return '';
    const bits = [];
    if (c.v) bits.push('v' + c.v);
    if (c.visiting) bits.push('visiting another resort');
    else if (c.tutorial) bits.push('in the tutorial');
    else if (c.started === false) bits.push('before starting');

    if (c.mt) bits.push(mtName(c.mt));
    if (c.season) bits.push(`season ${c.season}${c.date ? `, ${c.date}` : ''}`);
    if (c.lifts != null && !c.visiting) bits.push(`${c.lifts} lifts, ${c.trails} trails`);
    if (c.cash != null && !c.visiting) bits.push(`${c.cash < 0 ? '−' : ''}$${num(Math.abs(c.cash))}`);
    if (c.screen) bits.push(deviceOf(c));
    return bits.join(' · ');
  }
  function renderFeedback() {
    const el = $('feedback'); if (!el) return;
    const ofKind = (f) => fbKind === 'all' || (fbKind === 'ideas') === isIdea(f.message);
    const list = fb.items.filter((f) => ofKind(f) && (!fbPlayer || f.player === fbPlayer));
    const cut = fbAll ? list : list.slice(0, FB_ROWS);
    const who = fbPlayer && fb.items.find((f) => f.player === fbPlayer);
    const nameOf = (f) => f.name ? `<b>${esc(f.name)}</b>` : f.via === 'guest' ? '<b>Guest</b>' : f.via === 'gone' ? '<span class="note">Deleted account</span>' : '<b>No name set</b>';

      return `<li class="${idea ? 'idea' : ''}"><div class="top"><span class="kind">${idea ? '💡 Idea' : '💬 Feedback'}</span>${isNew(f) ? '<span class="new">New</span>' : ''}<time datetime="${esc(f.created_at)}" title="${esc(when.toLocaleString())}">${ago(f.created_at)} · ${when.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}</time></div>
        <div class="msg">${esc(idea ? f.message.slice(IDEA.length).trim() : f.message)}</div>
        ${fb.who ? `<div class="who"><span>${nameOf(f)}${via(f) ? ` <span class="note">· ${via(f)}</span>` : ''}</span>${f.player && Number(f.sent) > 1 && !fbPlayer ? `<button class="linkb" data-fbplayer="${esc(f.player)}">All ${num(f.sent)} from them</button>` : ''}
          ${f.resort ? `<a class="go" href="./?visit=${encodeURIComponent(f.resort)}">Visit ${esc(f.resort_name || 'resort')} ›</a>` : '<span class="nogo">No online resort</span>'}

    };

        ${who ? `<div class="fbwho">From ${who.name ? `<b>${esc(who.name)}</b>` : 'one player'} <button class="linkb" data-fbplayer="">Show everyone</button></div>` : ''}</div>

      ${cut.length ? `<ul class="fb">${cut.map(item).join('')}</ul>` : '<p class="note">Nothing here yet.</p>'}
      ${list.length > FB_ROWS ? `<p class="more"><button class="linkb" data-fbmore="1">${fbAll ? `Show the newest ${FB_ROWS}` : `Show all ${num(list.length)}`}</button></p>` : ''}`;

  function feedbackBadge() {

  }

  const SEASON_MONTHS = ['Sep', 'Oct', 'Nov', 'Dec', 'Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug']; // in-game dates run through a winter
  // Thumbs up and down on each update, from players in a resort when it arrived.
  // Everyone who signed in with Google or email, newest activity first, with their resorts.
  function playersHtml(p) {

          <td>${day(u.joined)}</td><td>${u.last_seen ? ago(u.last_seen) : '–'}</td>
          <td>${u.mountains.length ? u.mountains.map((m) => `<div class="pres"><a class="visit" href="./?visit=${encodeURIComponent(m.id)}">${esc(m.name || 'Unnamed')}</a>${m.public ? '' : ' <span class="priv">private</span>'}
            <span class="note">${esc(mtName(m.mt ?? ''))} · season ${m.season || 1} · ${num(m.guests || 0)} guests all time · ${m.lifts || 0} lifts, ${m.trails || 0} trails${m.stars != null ? ` · ★ ${m.stars}` : ''} · ${ago(m.updated)}</span></div>`).join('') : '<span class="note">No resort saved</span>'}</td></tr>`;
      }).join('')}</tbody></table></div></details>`;
  }
  // What each update added, read from the game's own What's new list, so a reaction can be matched to
  // the features it's about. Missing it just leaves the version numbers.
  let CHANGES = {};
  async function loadChanges() {
    try {
      const src = await (await fetch('./', { cache: 'no-store' })).text();
      const re = /\{ v: '([\d.]+)',[^\n]*?title: '((?:[^'\\]|\\.)*)'[\s\S]*?items: \[\s*'((?:[^'\\]|\\.)*)'/g;
      for (let m; (m = re.exec(src));) if (!CHANGES[m[1]]) CHANGES[m[1]] = { title: m[2].replace(/\\'/g, "'"), item: m[3].replace(/\\'/g, "'") };
    } catch (e) { /* the version numbers will do */ }
  }
  const brief = (t) => (t.length > 140 ? `${t.slice(0, 137).replace(/\s+\S*$/, '')}…` : t);
  function reactionsHtml(r) {
    if (!r || r.missing) return '<h2>Update reactions</h2><p class="note">Not set up yet. Run <b>supabase/reactions.sql</b> in the Supabase SQL Editor.</p>';
    if (r.message) return `<h2>Update reactions</h2><p class="note err">${esc(r.message)}</p>`;
    if (!r.length) return '<h2>Update reactions</h2><p class="note">No reactions yet. Players see the update card the next time they play after an update.</p>';
    return `<h2>Update reactions</h2><table class="rx"><tbody>${r.map((v) => { const n = v.up + v.down, pct = n ? Math.round(v.up / n * 100) : 0;
      const c = CHANGES[v.version];
      return `<tr><td class="ver">v${esc(v.version)}${c ? `<span class="rxwhat"><b>${esc(c.title)}</b><small>${esc(brief(c.item))}</small></span>` : ''}</td><td>👍 ${num(v.up)}</td><td>👎 ${num(v.down)}</td><td><span class="rxbar"><i style="width:${pct}%"></i></span> ${pct}% liked</td><td class="note">${ago(v.latest)}</td></tr>`; }).join('')}</tbody></table>`;
  }
  // Crash reports from players' devices, grouped by version and message.
  function errorsHtml(e) {
    if (!e || e.missing) return '<h2>Errors</h2><p class="note">Crash reporting isn’t set up yet. Run <b>supabase/errors.sql</b> in the Supabase SQL Editor.</p>';
    if (e.message) return `<h2>Errors</h2><p class="note err">${esc(e.message)}</p>`;
    if (!e.groups.length) return '<h2>Errors</h2><p class="note">No errors reported in the last two weeks. ✓</p>';
    return `<h2>Errors</h2><p class="note"><span class="${e.last_24h ? 'err' : ''}">${num(e.last_24h)} in the last 24 hours</span> · ${num(e.last_7d)} this week from ${num(e.players_7d)} ${e.players_7d === 1 ? 'player' : 'players'}. Newest first; tap one for details.</p>
      <div class="errs">${e.groups.map((g) => `<details><summary><span class="ver">v${esc(g.version)}</span><span class="msg">${esc(g.message)}</span><span class="cnt">${num(g.n)}× · ${num(g.players)} ${g.players === 1 ? 'player' : 'players'} · ${ago(g.last_seen)}</span></summary><pre>${esc(g.source || '(no details)')}</pre><p class="note">${esc(g.device || '')}</p></details>`).join('')}</div>`;
  }
  // The resorts table sorts by any column: tap a heading, tap again to reverse.
  const COLS = [
    ['name', 'Resort', 'text', (t) => (t.name || 'Unnamed').toLowerCase()],
    ['mt', 'Mountain', 'text', (t) => mtName(t.mt ?? '')],
    ['when', 'Date in game', 'num', (t) => { const m = /Season (\d+)\D+(\w{3}) (\d+)/.exec(t.when || ''); return m ? +m[1] * 1000 + SEASON_MONTHS.indexOf(m[2]) * 40 + +m[3] : 0; }],
    ['lifts', 'Lifts', 'num', (t) => t.lifts],
    ['trails', 'Trails', 'num', (t) => t.trails],
    ['best_guests', 'Best day', 'num', (t) => t.best_guests],
    ['cash', 'Cash', 'num', (t) => t.cash],
    ['updated_at', 'Played', 'num', (t) => +new Date(t.updated_at)],
    ['featured', 'Pick', 'num', (t) => (t.featured ? 1 : 0)],
  ];
  let rows = [], sort = { k: 'best_guests', dir: -1 }, range = 'recent';
  try { if (localStorage.getItem('mmStatsRange') === 'all') range = 'all'; } catch (e) { /* the default */ }
  const recentRows = () => rows.filter((t) => Date.now() - new Date(t.updated_at) < 48 * 3600e3);
  try { const v = JSON.parse(localStorage.getItem('mmStatsSort')); if (v && COLS.some((c) => c[0] === v.k)) sort = v; } catch (e) { /* keep the default */ }
  // The resorts table shows the top rows until you ask for the rest.
  const RESORT_ROWS = 15;
  let resortsAll = false;
  function renderResorts() {
    const col = COLS.find((c) => c[0] === sort.k), key = col[3];
    const shown = range === 'recent' ? recentRows() : rows;
    if (!shown.length) { $('resorts').innerHTML = '<p class="note">Nobody has played in the last 48 hours. <button class="linkb" data-range="all">Show all resorts</button></p>'; return; }
    const list = [...shown].sort((a, b) => { const x = key(a), y = key(b); return (x < y ? -1 : x > y ? 1 : 0) * sort.dir || (b.best_guests - a.best_guests); });
    const th = ([k, label, kind]) => `<th class="${kind === 'num' && k !== 'updated_at' && k !== 'when' ? 'num' : ''}" aria-sort="${sort.k === k ? (sort.dir > 0 ? 'ascending' : 'descending') : 'none'}"><button class="sortb${sort.k === k ? ' on' : ''}" data-k="${k}">${label}<span aria-hidden="true">${sort.k === k ? (sort.dir > 0 ? '▲' : '▼') : ''}</span></button></th>`;
    const cut = resortsAll ? list : list.slice(0, RESORT_ROWS);
    $('resorts').innerHTML = `<table><thead><tr>${COLS.map(th).join('')}</tr></thead>
      <tbody>${cut.map((t) => `<tr><td><a class="visit" href="./?visit=${encodeURIComponent(t.id)}">${esc(t.name || 'Unnamed')}</a>${t.public ? '' : ' <span class="priv">private</span>'}</td><td>${esc(mtName(t.mt ?? ''))}</td><td>${esc(t.when || '')}</td><td class="num">${t.lifts}</td><td class="num">${t.trails}</td><td class="num">${num(t.best_guests)}</td><td class="num">${t.cash < 0 ? '−' : ''}$${num(Math.abs(t.cash))}</td><td>${ago(t.updated_at)}</td><td>${t.public ? `<button class="pickb${t.featured ? ' on' : ''}" data-pick="${esc(t.id)}" title="${t.featured ? 'Remove from staff picks' : 'Add to staff picks (shown in Browse)'}" aria-pressed="${!!t.featured}">${t.featured ? '★' : '☆'}</button>` : ''}</td></tr>`).join('')}</tbody></table>${list.length > RESORT_ROWS ? `<p class="more"><button class="linkb" data-more="1">${resortsAll ? `Show the top ${RESORT_ROWS}` : `Show all ${num(list.length)}`}</button></p>` : ''}`;
  }
  // Remember whether the players list was left open.
  document.addEventListener('toggle', (e) => {
    if (e.target.id === 'playersFold') try { localStorage.setItem('mm.stats.playersOpen', e.target.open ? '1' : '0'); } catch (err) {}
  }, true);
  document.addEventListener('click', async (e) => {
    const tb = e.target.closest('[data-tab]');
    if (tb) { showTab(tb.dataset.tab); return window.scrollTo({ top: 0 }); }
    const fk = e.target.closest('[data-fbkind]');
    if (fk) { fbKind = fk.dataset.fbkind; fbAll = false; return renderFeedback(); }
    const fp = e.target.closest('[data-fbplayer]');
    if (fp) { fbPlayer = fp.dataset.fbplayer || null; fbAll = false; renderFeedback(); return window.scrollTo({ top: 0 }); }
    if (e.target.closest('[data-fbmore]')) { fbAll = !fbAll; return renderFeedback(); }
    const pk = e.target.closest('[data-pick]');
    if (pk) {
      const t = rows.find((x) => x.id === pk.dataset.pick); if (!t) return;
      pk.disabled = true;
      const { error } = await sb.rpc('admin_feature', { mid: t.id, pick: !t.featured });
      if (!error) t.featured = !t.featured;
      return renderResorts();
    }
    if (e.target.closest('[data-more]')) { resortsAll = !resortsAll; return renderResorts(); }
    const r = e.target.closest('[data-range]');
    if (r) {
      range = r.dataset.range;
      try { localStorage.setItem('mmStatsRange', range); } catch (e2) { /* fine without it */ }
      document.querySelectorAll('.range [data-range]').forEach((x) => x.setAttribute('aria-pressed', String(x.dataset.range === range)));
      return renderResorts();
    }
    const b = e.target.closest('.sortb'); if (!b) return;
    const k = b.dataset.k, kind = COLS.find((c) => c[0] === k)[2];
    sort = sort.k === k ? { k, dir: -sort.dir } : { k, dir: kind === 'text' ? 1 : -1 };
    try { localStorage.setItem('mmStatsSort', JSON.stringify(sort)); } catch (e2) { /* fine without it */ }
    renderResorts();
  });
  $('refresh').onclick = load;
  load().catch((e) => gate(`<span class="err">${esc(e.message || e)}</span>`));
})();
</script>
</body>
</html>
