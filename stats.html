<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Mogul Stats</title>
<link rel="icon" type="image/png" sizes="192x192" href="vendor/icon-192-v2.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root {
  --ink: #14243a; --ink-2: #51627a; --muted: #7a8aa0; --line: rgba(20, 36, 58, 0.12);
  --card: rgba(255, 255, 255, 0.86); --accent: #df562c; --bar: #2b5d9e; --bar-soft: #c9d8ec;
  --display: 'Big Shoulders Display', 'Arial Narrow', sans-serif; --ui: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: linear-gradient(180deg, #bfd3ea 0%, #e8eef6 40%, #eef2f7 100%) fixed; color: var(--ink); font-family: var(--ui); -webkit-font-smoothing: antialiased; }
main { max-width: 980px; margin: 0 auto; padding: 24px 16px 48px; }
header { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
header svg { width: 44px; height: 44px; border-radius: 10px; flex: none; }
h1 { font-family: var(--display); font-weight: 800; font-size: 34px; letter-spacing: 0.02em; text-transform: uppercase; margin: 0; line-height: 1; }
.sub { color: var(--ink-2); font-size: 13px; margin-top: 3px; }
header .back { margin-left: auto; color: var(--ink); font: 600 14px var(--ui); text-decoration: none; padding: 9px 6px; }
header button { border: 1px solid var(--line); background: var(--card); color: var(--ink); font: 600 14px var(--ui); padding: 9px 14px; border-radius: 10px; cursor: pointer; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); margin-bottom: 12px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; box-shadow: 0 6px 18px rgba(20, 36, 58, 0.07); }
.tile dt { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); }
.tile dd { margin: 4px 0 0; font-family: var(--display); font-weight: 800; font-size: 40px; line-height: 1; font-variant-numeric: tabular-nums; }
.tile small { display: block; margin-top: 4px; color: var(--muted); font-size: 12.5px; }
h2 { font-size: 15px; margin: 0 0 4px; }
.note { color: var(--ink-2); font-size: 12.5px; margin: 0 0 12px; }
.two { display: grid; gap: 12px; grid-template-columns: 1fr; margin-bottom: 12px; }
@media (min-width: 760px) { .two { grid-template-columns: 1fr 1fr; } }
.cols { display: flex; align-items: flex-end; gap: 2px; height: 150px; border-bottom: 1px solid var(--line); }
.col { flex: 1 1 0; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; position: relative; min-width: 0; }
.col i { display: block; width: 100%; max-width: 26px; background: var(--accent); border-radius: 4px 4px 0 0; min-height: 2px; }
.col b { font-size: 11px; font-weight: 600; color: var(--ink-2); margin-bottom: 3px; font-variant-numeric: tabular-nums; }
.col:hover i { background: #b8431f; }
.days { display: flex; gap: 2px; margin-top: 5px; }
.days span { flex: 1 1 0; text-align: center; font-size: 10.5px; color: var(--muted); min-width: 0; white-space: nowrap; }
.days span:first-child { text-align: left; }
.bars { display: grid; gap: 9px; }
.bar { display: grid; grid-template-columns: minmax(110px, 38%) 1fr; gap: 10px; align-items: center; font-size: 13.5px; }
.bar .track { position: relative; height: 22px; overflow: hidden; }
.bar .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--bar); border-radius: 0 4px 4px 0; min-width: 2px; }
.bar .val.in { color: #fff; }
.bar .val { position: absolute; top: 2px; font-size: 12.5px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
.bar .lbl { color: var(--ink); }
.bar .lbl small { color: var(--muted); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); font-weight: 700; padding: 6px 6px; border-bottom: 1px solid var(--line); }
td { padding: 7px 6px; border-bottom: 1px solid var(--line); vertical-align: top; font-variant-numeric: tabular-nums; }
td.num, th.num { text-align: right; }
.scroll { overflow-x: auto; }
.head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
.head h2 { margin: 0; }
.range { display: inline-flex; gap: 2px; background: rgba(20, 36, 58, 0.06); padding: 3px; border-radius: 10px; }
.range button { border: 0; background: none; border-radius: 8px; padding: 6px 10px; font-family: inherit; font-weight: 600; font-size: 12.5px; color: var(--ink-2); cursor: pointer; }
.range button b { font-weight: 700; margin-left: 3px; }
.range button[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(20, 36, 58, 0.15); }
.pickb { border: 0; background: none; font-size: 18px; line-height: 1; cursor: pointer; color: #b9c2cf; padding: 2px 4px; }
.pickb.on { color: #d99a14; }
.linkb { border: 0; background: none; padding: 0; font: inherit; color: var(--accent, #df562c); text-decoration: underline; cursor: pointer; }
.sortb { border: 0; background: none; padding: 0; font: inherit; color: inherit; letter-spacing: inherit; text-transform: inherit; cursor: pointer; display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; }
.sortb span { font-size: 9px; color: var(--accent); }
.sortb.on { color: var(--ink); }
th.num .sortb { justify-content: flex-end; width: 100%; }
.visit { color: var(--ink); font-weight: 600; text-decoration: underline; text-decoration-color: rgba(20, 36, 58, 0.3); text-underline-offset: 3px; }
.priv { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 1px 6px; white-space: nowrap; }
.errs details { border-top: 1px solid var(--line); padding: 8px 0; }
.errs summary { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; cursor: pointer; list-style: none; font-size: 13.5px; }
.errs summary::-webkit-details-marker { display: none; }
.errs .ver { font-weight: 700; color: #b3261e; font-variant-numeric: tabular-nums; }
.errs .msg { overflow-wrap: anywhere; }
.errs .cnt { grid-column: 2; color: var(--muted); font-size: 12px; }
.errs pre { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 11.5px; background: rgba(20, 36, 58, 0.05); border-radius: 8px; padding: 8px; margin: 8px 0 4px; max-height: 220px; overflow: auto; }
.fb { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
.fb li { border-left: 3px solid var(--accent); padding: 2px 0 2px 10px; font-size: 13.5px; white-space: pre-wrap; overflow-wrap: anywhere; }
.fb time { display: block; color: var(--muted); font-size: 11.5px; margin-bottom: 2px; }
.gate { text-align: center; padding: 40px 20px; }
.gate a { color: var(--accent); font-weight: 600; }
.err { color: #b3261e; }
  .rx { width: 100%; border-collapse: collapse; font-size: 14px; }
  .rx td { padding: 6px 8px 6px 0; border-top: 1px solid rgba(20, 36, 58, 0.08); white-space: nowrap; }
  .rx .ver { font-weight: 700; }
  .rxbar { display: inline-block; width: 70px; height: 8px; border-radius: 4px; background: rgba(210, 60, 90, 0.25); vertical-align: middle; overflow: hidden; }
  .rxbar i { display: block; height: 100%; background: #2c9a55; }
</style>
</head>
<body>
<main>
  <header>
    <svg viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" fill="#14243a"/><path fill="#e8f0f8" d="M215 122 L39.5 409 L418.5 409 Z M368 204 L198.5 409 L482.3 409 Z"/><path fill="#fff" d="M215 122 L167.3 200 L196 184 L226 209 L258.2 183 Z"/><rect y="409" width="512" height="103" fill="#c9472a"/><path stroke="#c9472a" stroke-width="9" d="M147.2 420 L264 274"/></svg>
    <div><h1>Mogul Stats</h1><div class="sub" id="when">Loading…</div></div>
    <a class="back" href="./">‹ Game</a>
    <button id="refresh" hidden>Refresh</button>
  </header>
  <div id="out"></div>
</main>
<script src="vendor/supabase.js"></script>
<script>
(() => {
  const SB_URL = 'https://iwhhoneaxmeiktqzwxjs.supabase.co';
  const SB_KEY = 'sb_publishable_i3vLnQD9KEe1vjfXUORZdQ__M2xC90G';
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const num = (n) => Number(n || 0).toLocaleString('en-US');
  const pct = (a, b) => (b ? Math.round((a / b) * 100) + '%' : '–');
  const MT = { juniper: 'Juniper Ridge', maple: 'Maple Notch', raven: 'Raven Peak', '': 'Not recorded' };
  const mtName = (m) => MT[m] ?? (String(m).startsWith('c:') ? 'Custom mountain' : m);
  const ago = (t) => { const s = (Date.now() - new Date(t)) / 1000; return s < 3600 ? `${Math.max(1, Math.round(s / 60))} min ago` : s < 86400 ? `${Math.round(s / 3600)} h ago` : `${Math.round(s / 86400)} d ago`; };
  const sb = window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: true, autoRefreshToken: true } });

  const gate = (msg) => { $('when').textContent = ''; $('out').innerHTML = `<div class="card gate">${msg}</div>`; };

  async function load() {
    $('when').textContent = 'Loading…';
    const { data: { session } } = await sb.auth.getSession();
    if (!session || session.user.is_anonymous) return gate('Sign in on <a href="./">mtmogul.com</a> with your Google account (title screen › Community), then come back here.');
    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC';
    const { data, error } = await sb.rpc('admin_stats', { tz });
    if (error) {
      if (/not allowed|permission/i.test(error.message)) return gate(`Signed in as ${esc(session.user.email)}. These stats are only for the game’s owner.`);
      if (/admin_stats/.test(error.message)) return gate('<span class="err">The stats function isn’t set up yet.</span> Run <b>supabase/stats.sql</b> in the Supabase SQL Editor.');
      return gate(`<span class="err">${esc(error.message)}</span>`);
    }
    const [er, rx] = await Promise.all([sb.rpc('admin_errors'), sb.rpc('admin_reactions')]);
    render(data, er.error ? { missing: /admin_errors/.test(er.error.message), message: er.error.message } : er.data,
      rx.error ? { missing: /admin_reactions/.test(rx.error.message), message: rx.error.message } : rx.data);
  }

  function render(d, errs, reacts) {
    $('when').textContent = `Updated ${new Date(d.generated).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' })}`;
    $('refresh').hidden = false;
    // last 14 days, filling in days with no visitors
    const map = new Map(d.per_day.map((r) => [r.day, r.n]));
    const days = [];
    for (let i = 13; i >= 0; i--) { const t = new Date(); t.setDate(t.getDate() - i); const k = t.toLocaleDateString('en-CA'); days.push({ k, n: map.get(k) || 0, label: t.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }), short: String(t.getDate()), first: i === 13 || t.getDate() === 1 }); }
    const max = Math.max(1, ...days.map((x) => x.n));
    const funnel = [
      ['Opened the game', d.visitors], ['Started a mountain', d.started], ['Built a lift', d.built_lift],
      ['Opened for guests', d.opened], ['3+ goal stars', d.goals3], ['Reached season 2', d.season2],
    ];
    const bars = (rows, total) => `<div class="bars">${rows.map(([label, n, sub]) => {
      const w = total ? (n / total) * 100 : 0;
      return `<div class="bar" title="${esc(label)}: ${num(n)}${sub ? '' : ` (${pct(n, total)})`}"><span class="lbl">${esc(label)}${sub ? ` <small>${esc(sub)}</small>` : ''}</span><span class="track"><span class="fill" style="width:${w}%"></span>${w > 60 ? `<span class="val in" style="right:calc(${100 - w}% + 8px)">` : `<span class="val" style="left:calc(${w}% + 6px)">`}${num(n)}${sub ? '' : ` · ${pct(n, total)}`}</span></span></div>`;
    }).join('')}</div>`;
    const mts = d.by_mountain.map((r) => [mtName(r.mt), r.n]).reduce((acc, [k, n]) => { const f = acc.find((a) => a[0] === k); if (f) f[1] += n; else acc.push([k, n]); return acc; }, []).sort((a, b) => b[1] - a[1]);
    rows = d.top;
    $('out').innerHTML = `
      <dl class="grid">
        <div class="card tile"><dt>Players</dt><dd>${num(d.visitors)}</dd><small>opened the game, all time</small></div>
        <div class="card tile"><dt>New today</dt><dd>${num(d.new_24h)}</dd><small>last 24 hours · ${num(d.new_7d)} this week</small></div>
        <div class="card tile"><dt>Playing</dt><dd>${num(d.played_24h)}</dd><small>saved a game in 24 h · ${num(d.played_7d)} this week</small></div>
        <div class="card tile"><dt>Signed in</dt><dd>${num(d.signed_in)}</dd><small>Google or email accounts</small></div>
      </dl>
      <section class="card" style="margin-bottom:12px">
        <div class="head"><h2>Resorts</h2><div class="range" role="group" aria-label="Which resorts">
          <button data-range="recent" aria-pressed="${range === 'recent'}">Last 48 hours <b>${num(recentRows().length)}</b></button><button data-range="all" aria-pressed="${range === 'all'}">All <b>${num(d.mountains)}</b></button></div></div>
        <p class="note">Tap a column heading to sort, or a name to visit it read-only. Nothing you do there changes it. Tap ☆ to make a public resort a staff pick in the game’s Browse tab.</p>
        <div class="scroll" id="resorts"></div>
      </section>
      <section class="card" style="margin-bottom:12px" id="reacts">${reactionsHtml(reacts)}</section>
      <section class="card" style="margin-bottom:12px" id="errs">${errorsHtml(errs)}</section>
      <section class="card" style="margin-bottom:12px">
        <h2>New players per day</h2><p class="note">The last 14 days, in your time zone.</p>
        <div class="cols" role="img" aria-label="New players per day">${days.map((x) => `<div class="col" title="${x.label}: ${x.n} new"><b>${x.n || ''}</b><i style="height:${(x.n / max) * 82}%"></i></div>`).join('')}</div>
        <div class="days">${days.map((x) => `<span>${x.first ? x.label : x.short}</span>`).join('')}</div>
      </section>
      <div class="two">
        <section class="card"><h2>How far players get</h2><p class="note">Share of everyone who opened the game.</p>${bars(funnel, d.visitors)}</section>
        <section class="card"><h2>Mountains picked</h2><p class="note">${num(d.mountains)} mountains started.</p>${bars(mts.map(([k, n]) => [k, n, ' ']), Math.max(1, ...mts.map((m) => m[1])))}</section>
      </div>
      <section class="card">
        <h2>Feedback</h2><p class="note">${num(d.feedback_count)} ${d.feedback_count === 1 ? 'message' : 'messages'} from the “Send feedback” button. Newest first.</p>
        ${d.feedback.length ? `<ul class="fb">${d.feedback.map((f) => `<li><time>${new Date(f.created_at).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' })}</time>${esc(f.message)}</li>`).join('')}</ul>` : '<p class="note">None yet.</p>'}
      </section>`;
    renderResorts();
  }

  const SEASON_MONTHS = ['Sep', 'Oct', 'Nov', 'Dec', 'Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug']; // in-game dates run through a winter
  // Thumbs up and down on each update, from players in a resort when it arrived.
  function reactionsHtml(r) {
    if (!r || r.missing) return '<h2>Update reactions</h2><p class="note">Not set up yet. Run <b>supabase/reactions.sql</b> in the Supabase SQL Editor.</p>';
    if (r.message) return `<h2>Update reactions</h2><p class="note err">${esc(r.message)}</p>`;
    if (!r.length) return '<h2>Update reactions</h2><p class="note">No reactions yet. Players see the update card the next time they play after an update.</p>';
    return `<h2>Update reactions</h2><table class="rx"><tbody>${r.map((v) => { const n = v.up + v.down, pct = n ? Math.round(v.up / n * 100) : 0;
      return `<tr><td class="ver">v${esc(v.version)}</td><td>👍 ${num(v.up)}</td><td>👎 ${num(v.down)}</td><td><span class="rxbar"><i style="width:${pct}%"></i></span> ${pct}% liked</td><td class="note">${ago(v.latest)}</td></tr>`; }).join('')}</tbody></table>`;
  }
  // Crash reports from players' devices, grouped by version and message.
  function errorsHtml(e) {
    if (!e || e.missing) return '<h2>Errors</h2><p class="note">Crash reporting isn’t set up yet. Run <b>supabase/errors.sql</b> in the Supabase SQL Editor.</p>';
    if (e.message) return `<h2>Errors</h2><p class="note err">${esc(e.message)}</p>`;
    if (!e.groups.length) return '<h2>Errors</h2><p class="note">No errors reported in the last two weeks. ✓</p>';
    return `<h2>Errors</h2><p class="note">${num(e.last_24h)} in the last 24 hours · ${num(e.last_7d)} this week from ${num(e.players_7d)} ${e.players_7d === 1 ? 'player' : 'players'}. Newest first; tap one for details.</p>
      <div class="errs">${e.groups.map((g) => `<details><summary><span class="ver">v${esc(g.version)}</span><span class="msg">${esc(g.message)}</span><span class="cnt">${num(g.n)}× · ${num(g.players)} ${g.players === 1 ? 'player' : 'players'} · ${ago(g.last_seen)}</span></summary><pre>${esc(g.source || '(no details)')}</pre><p class="note">${esc(g.device || '')}</p></details>`).join('')}</div>`;
  }
  // The resorts table sorts by any column: tap a heading, tap again to reverse.
  const COLS = [
    ['name', 'Resort', 'text', (t) => (t.name || 'Unnamed').toLowerCase()],
    ['mt', 'Mountain', 'text', (t) => mtName(t.mt ?? '')],
    ['when', 'Date in game', 'num', (t) => { const m = /Season (\d+)\D+(\w{3}) (\d+)/.exec(t.when || ''); return m ? +m[1] * 1000 + SEASON_MONTHS.indexOf(m[2]) * 40 + +m[3] : 0; }],
    ['lifts', 'Lifts', 'num', (t) => t.lifts],
    ['trails', 'Trails', 'num', (t) => t.trails],
    ['best_guests', 'Best day', 'num', (t) => t.best_guests],
    ['cash', 'Cash', 'num', (t) => t.cash],
    ['updated_at', 'Played', 'num', (t) => +new Date(t.updated_at)],
    ['featured', 'Pick', 'num', (t) => (t.featured ? 1 : 0)],
  ];
  let rows = [], sort = { k: 'best_guests', dir: -1 }, range = 'recent';
  try { if (localStorage.getItem('mmStatsRange') === 'all') range = 'all'; } catch (e) { /* the default */ }
  const recentRows = () => rows.filter((t) => Date.now() - new Date(t.updated_at) < 48 * 3600e3);
  try { const v = JSON.parse(localStorage.getItem('mmStatsSort')); if (v && COLS.some((c) => c[0] === v.k)) sort = v; } catch (e) { /* keep the default */ }
  function renderResorts() {
    const col = COLS.find((c) => c[0] === sort.k), key = col[3];
    const shown = range === 'recent' ? recentRows() : rows;
    if (!shown.length) { $('resorts').innerHTML = '<p class="note">Nobody has played in the last 48 hours. <button class="linkb" data-range="all">Show all resorts</button></p>'; return; }
    const list = [...shown].sort((a, b) => { const x = key(a), y = key(b); return (x < y ? -1 : x > y ? 1 : 0) * sort.dir || (b.best_guests - a.best_guests); });
    const th = ([k, label, kind]) => `<th class="${kind === 'num' && k !== 'updated_at' && k !== 'when' ? 'num' : ''}" aria-sort="${sort.k === k ? (sort.dir > 0 ? 'ascending' : 'descending') : 'none'}"><button class="sortb${sort.k === k ? ' on' : ''}" data-k="${k}">${label}<span aria-hidden="true">${sort.k === k ? (sort.dir > 0 ? '▲' : '▼') : ''}</span></button></th>`;
    $('resorts').innerHTML = `<table><thead><tr>${COLS.map(th).join('')}</tr></thead>
      <tbody>${list.map((t) => `<tr><td><a class="visit" href="./?visit=${encodeURIComponent(t.id)}">${esc(t.name || 'Unnamed')}</a>${t.public ? '' : ' <span class="priv">private</span>'}</td><td>${esc(mtName(t.mt ?? ''))}</td><td>${esc(t.when || '')}</td><td class="num">${t.lifts}</td><td class="num">${t.trails}</td><td class="num">${num(t.best_guests)}</td><td class="num">${t.cash < 0 ? '−' : ''}$${num(Math.abs(t.cash))}</td><td>${ago(t.updated_at)}</td><td>${t.public ? `<button class="pickb${t.featured ? ' on' : ''}" data-pick="${esc(t.id)}" title="${t.featured ? 'Remove from staff picks' : 'Add to staff picks (shown in Browse)'}" aria-pressed="${!!t.featured}">${t.featured ? '★' : '☆'}</button>` : ''}</td></tr>`).join('')}</tbody></table>`;
  }
  document.addEventListener('click', async (e) => {
    const pk = e.target.closest('[data-pick]');
    if (pk) {
      const t = rows.find((x) => x.id === pk.dataset.pick); if (!t) return;
      pk.disabled = true;
      const { error } = await sb.rpc('admin_feature', { mid: t.id, pick: !t.featured });
      if (!error) t.featured = !t.featured;
      return renderResorts();
    }
    const r = e.target.closest('[data-range]');
    if (r) {
      range = r.dataset.range;
      try { localStorage.setItem('mmStatsRange', range); } catch (e2) { /* fine without it */ }
      document.querySelectorAll('.range [data-range]').forEach((x) => x.setAttribute('aria-pressed', String(x.dataset.range === range)));
      return renderResorts();
    }
    const b = e.target.closest('.sortb'); if (!b) return;
    const k = b.dataset.k, kind = COLS.find((c) => c[0] === k)[2];
    sort = sort.k === k ? { k, dir: -sort.dir } : { k, dir: kind === 'text' ? 1 : -1 };
    try { localStorage.setItem('mmStatsSort', JSON.stringify(sort)); } catch (e2) { /* fine without it */ }
    renderResorts();
  });
  $('refresh').onclick = load;
  load().catch((e) => gate(`<span class="err">${esc(e.message || e)}</span>`));
})();
</script>
</body>
</html>
